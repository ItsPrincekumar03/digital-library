<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Log in | Digital Library</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <script type="module" src="js/router.js"></script>
</head>

<body data-page="login" data-access="guest">

    <div id="site-header"></div>

    <main class="container narrow page-main">

        <section class="card form-card">

            <p class="eyebrow">Welcome back</p>

            <h1>Log in</h1>

            <p class="muted">
                Use your Digital Library account.
            </p>

            <form id="login-form" novalidate>

                <div class="form-field">
                    <label for="email">Email address</label>

                    <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
                </div>

                <div class="form-field">
                    <label for="password">Password</label>

                    <div class="password-container">

                        <input id="password" name="password" type="password" autocomplete="current-password" required>

                        <button id="password-toggle" class="password-toggle" type="button" aria-label="Show password">
                            👁
                        </button>

                    </div>
                </div>

                <p id="form-error" class="form-message error-message" role="alert" hidden></p>

                <button class="button button-primary button-full" type="submit">
                    Log in
                </button>

            </form>

            <p class="form-footnote">
                Don’t have an account?
                <a href="register.html">Create one</a>.
            </p>

        </section>

    </main>

    <div id="site-footer"></div>

</body>

</html>
