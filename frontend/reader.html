<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Reader | Digital Library</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/reader.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
    <script type="module" src="js/router.js"></script>
</head>
<body data-page="reader" data-access="public" class="reader-theme-light">
    <div id="reader-progress-bar" class="reader-progress-bar"></div>

    <header class="reader-header">
        <div class="reader-header-inner">
            <div class="reader-header-left">
                <a id="reader-back-link" href="#" class="reader-nav-link">
                    <span>&larr;</span> <span>Back</span>
                </a>
                <div class="reader-title-group">
                    <span id="reader-book-title" class="reader-book-title">Loading PDF...</span>
                    <span id="reader-page-indicator" class="reader-chapter-indicator muted"></span>
                </div>
            </div>

            <div class="reader-header-actions">
                <button id="btn-zoom-out" type="button" class="reader-tool-btn" title="Zoom Out">
                    <span class="tool-label">Zoom Out</span>
                </button>
                <span id="zoom-level-display">100%</span>
                <button id="btn-zoom-in" type="button" class="reader-tool-btn" title="Zoom In">
                    <span class="tool-label">Zoom In</span>
                </button>
                <button id="btn-toggle-settings" type="button" class="reader-tool-btn" title="Reader Settings">
                    <span class="tool-icon">&#9881;</span>
                    <span class="tool-label">Settings</span>
                </button>
            </div>
        </div>
    </header>

    <div id="reader-overlay" class="reader-overlay" hidden></div>

    <aside id="reader-settings-drawer" class="reader-drawer reader-settings-drawer" hidden>
        <div class="drawer-header">
            <h2 class="drawer-title">Reader Settings</h2>
            <button id="btn-close-settings" class="drawer-close-btn">&times;</button>
        </div>
        <div class="drawer-body">
            <fieldset class="setting-group">
                <legend class="setting-label">Theme (Eye-Friendly)</legend>
                <div class="setting-theme-grid">
                    <button type="button" class="theme-option-btn is-active" data-theme="light">Light</button>
                    <button type="button" class="theme-option-btn" data-theme="dark">Dark</button>
                    <button type="button" class="theme-option-btn" data-theme="sepia">Sepia</button>
                </div>
            </fieldset>

            <fieldset class="setting-group">
                <legend class="setting-label">Page Spacing</legend>
                <div class="setting-segment-grid">
                    <button type="button" class="segment-btn" data-spacing="compact">Compact</button>
                    <button type="button" class="segment-btn is-active" data-spacing="normal">Normal</button>
                    <button type="button" class="segment-btn" data-spacing="relaxed">Relaxed</button>
                </div>
            </fieldset>

            <fieldset class="setting-group">
                <legend class="setting-label">Reading Width</legend>
                <div class="setting-segment-grid">
                    <button type="button" class="segment-btn" data-width="narrow">Narrow</button>
                    <button type="button" class="segment-btn is-active" data-width="normal">Normal</button>
                    <button type="button" class="segment-btn" data-width="wide">Wide</button>
                </div>
            </fieldset>

            <div class="setting-group setting-footer">
                <button id="btn-reset-settings" class="button button-secondary button-full">Reset to defaults</button>
            </div>
        </div>
    </aside>

    <main class="reader-main">
        <div id="reader-loading" class="reader-status-card loading-state">
            <p>Loading PDF document...</p>
        </div>
        <div id="reader-error" class="reader-status-card form-message error-message" hidden></div>
        
        <article id="reader-content" class="reader-content reader-width-normal reader-spacing-normal" hidden>
            <!-- PDF pages will be rendered here consecutively -->
            <div id="pdf-viewer" class="pdf-viewer"></div>
        </article>
    </main>
</body>
</html>
