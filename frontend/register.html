<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Create an account | Digital Library</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <script type="module" src="js/router.js"></script>
</head>

<body data-page="register" data-access="guest">

    <div id="site-header"></div>

    <main class="container narrow page-main">

        <section class="card form-card">

            <p class="eyebrow">Join the library</p>

            <h1>Create an account</h1>

            <p class="muted">
                New accounts are created with normal user access.
            </p>

            <form id="register-form" novalidate>

                <div class="form-field">
                    <label for="name">Name</label>

                    <input id="name" name="name" type="text" autocomplete="name" required maxlength="100">
                </div>

                <div class="form-field">
                    <label for="email">Email address</label>

                    <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
                </div>

                <div class="form-field">
                    <label for="password">Password</label>

                    <input id="password" name="password" type="password" autocomplete="new-password" required
                        minlength="8">

                    <small class="field-hint">
                        Use at least 8 characters, or follow any stricter requirements
                        shown by the server.
                    </small>
                </div>

                <p id="form-error" class="form-message error-message" role="alert" hidden></p>

                <button class="button button-primary button-full" type="submit">
                    Create account
                </button>

            </form>

            <p class="form-footnote">
                Already registered?
                <a href="login.html">Log in</a>.
            </p>

        </section>

    </main>

    <div id="site-footer"></div>

</body>

</html>
